[package]
name = "eliza"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["rlib", "cdylib"]  # cdylib for the wasm build (web/)

[dependencies]
# TUI-only deps: the engine itself is dependency-free (and wasm-compatible).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
crossterm = "0.29.0"
ratatui = "0.30.2"
